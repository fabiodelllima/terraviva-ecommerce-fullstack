# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Frontend (Vite + Vue) - npm
  - package-ecosystem: "npm"
    directory: "/terraviva/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # Backend (Django) - pip via requirements
  - package-ecosystem: "pip"
    directory: "/terraviva/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Social auth nao e usado: social_django ausente de INSTALLED_APPS e
      # djoser.urls.social nao registrado. Ambos vem como dependencia
      # obrigatoria do djoser, que fixa social-auth-app-django<6.0.0.
      # Reavaliar se login social for implementado.
      - dependency-name: "social-auth-app-django"
        versions: [">=6.0.0"]
      - dependency-name: "social-auth-core"
        versions: [">=5.0.0"]
  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/terraviva/frontend"
      - "/terraviva/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
